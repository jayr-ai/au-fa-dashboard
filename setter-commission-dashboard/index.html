<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership View - Setter Commission</title>
    <link rel="stylesheet" href="css/style.css?v=20260922010000">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>Leadership View</h1>
                <p class="user-info" id="userInfo">Signed in as jayvee.respeto@miyagi.coach</p>
            </div>
            <div class="header-actions">
                <button class="refresh-btn" id="refreshBtn" title="Refresh data from source">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 4v6h6M23 20v-6h-6"></path>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64M3.51 15A9 9 0 0 0 18.36 18.36"></path>
                    </svg>
                    Refresh
                </button>
                <select class="time-filter" id="timeFilter">
                    <option value="all">All Time</option>
                    <option value="month">This Month</option>
                    <option value="week">This Week</option>
                </select>
                <a href="#" class="logout-btn">Log out</a>
            </div>
        </header>

        <!-- KPI Cards -->
        <section class="kpi-section">
            <div class="kpi-card">
                <div class="kpi-label">TEAM COMMISSION</div>
                <div class="kpi-value" id="teamCommission">$0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">QUALIFIED TRANSACTIONS</div>
                <div class="kpi-value" id="qualifiedTx">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">TOTAL SALES GENERATED</div>
                <div class="kpi-value" id="totalSales">$0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">ACTIVE SETTERS</div>
                <div class="kpi-value gold" id="activeSetters">0</div>
            </div>
        </section>

        <!-- Charts Section -->
        <section class="charts-section">
            <div class="chart-card">
                <h3>TEAM COMMISSION OVER TIME</h3>
                <canvas id="commissionChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>COMMISSION BY SETTER</h3>
                <canvas id="setterChart"></canvas>
            </div>
        </section>

        <!-- Leaderboard Section -->
        <section class="leaderboard-section">
            <h3>LEADERBOARD</h3>
            <div class="leaderboard-table" id="leaderboardTable">
                <!-- Generated by JavaScript -->
            </div>
        </section>

        <!-- Loading State -->
        <div id="loadingMessage" class="loading-message" style="display: none;">
            Refreshing data...
        </div>
    </div>

    <script src="js/app.js?v=20260922010000"></script>
</body>
</html>
