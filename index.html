function agentCell(r) {
  return `<td class="agent">${r.short}${r.active?'':'<span class="inactive-tag">inactive</span>'}` +
         `<span class="full">${r.full||''}</span></td>`;
}

function renderTable(rows, cols, hasData) {
  const card = el('div','card'), scroll = el('div','scroll'), t = el('table');
  t.innerHTML = '<thead><tr><th class="agent">Agent</th>' +
    cols.map(c => `<th class="${c[2]?'grp':''}">${c[0]}</th>`).join('') + '</tr></thead>';
  const tb = el('tbody');
  for (const r of rows) {
    const tr = el('tr');
    if (!hasData(r.m)) {
      // A gap is not a zero. Rendering 0% here would read as "performed terribly".
      tr.innerHTML = agentCell(r) + `<td class="nodata" colspan="${cols.length}">No data recorded in this period</td>`;
    } else {
      tr.innerHTML = agentCell(r) + cols.map(c => {
        const v = c[1](r.m);
        return `<td class="${c[2]?'grp':''}${v==='–'?' nil':''}">${v}</td>`;
      }).join('');
    }
    tb.appendChild(tr);
  }
  const present = rows.filter(r => hasData(r.m));
  if (present.length) {
    const tot = sumAgents(present.map(r => r.m));
    const tr = el('tr','overall');
    tr.innerHTML = `<td class="agent">Overall<span class="full">${present.length} rep${present.length===1?'':'s'} with data</span></td>` +
      cols.map(c => `<td class="${c[2]?'grp':''}">${c[1](tot)}</td>`).join('');
    tb.appendChild(tr);
  }
  t.appendChild(tb); scroll.appendChild(t); card.appendChild(scroll);
  return card;
}

function renderBoard(rows, priorMetrics) {
  const scored = scoreCohort(rows.filter(r => r.m.hasFunnel).map(r => ({...r})));
  if (!scored.length) return null;
  const prior = scoreCohort(rows.filter(r => r.m.hasFunnel)
    .map(r => ({...r, m: priorMetrics.get(r.short) || derive(blankMetrics())})));
  const priorRank = new Map(prior.map(p => [p.short, p.rank]));

  scored.sort((a,b) => (a.rank ?? 99) - (b.rank ?? 99) || b.score - a.score);
  const board = el('div','board');
  for (const r of scored) {
    const card = el('div','lb glow' + (r.rank===1?' top':'') + (r.qualified?'':' unranked'));
    const pr = priorRank.get(r.short);
    let delta = '';
    if (r.qualified && pr) {
      const d = pr - r.rank;
      delta = d === 0
        ? `<span class="delta" title="Same rank as the previous period">—</span>`
        : `<span class="delta ${d>0?'up':'down'}" title="Was #${pr} last period">${d>0?'▲':'▼'}${Math.abs(d)}</span>`;
    } else if (r.qualified) {
      delta = `<span class="delta" title="No ranking in the previous period">new</span>`;
    }
    const medal = r.rank && r.rank <= 3 ? `<span class="medal">${MEDALS[r.rank-1]}</span>` : '';
    card.innerHTML =
      `<div class="lb-head">${medal}
        <div><div class="lb-rank">${r.qualified?'RANK '+r.rank:'NOT RANKED'}</div>
        <div class="lb-name">${r.short}${r.active?'':'<span class="inactive-tag">inactive</span>'}<span class="full">${r.full||''}</span></div></div>${delta}</div>
       <div class="lb-hero"><span class="cap">Revenue sold</span><span class="n">${fmtMoney(r.m.revenue)}</span></div>
       <div class="lb-sub">
         <span>Composite <span class="cs">${r.qualified?r.score.toFixed(3):'–'}</span></span>
         <span class="info" title="Relative to the other reps in this tier for the selected period, not an absolute measure. Min-max normalised: the top performer always scores 1.00 on a component and the bottom 0.00. Changing the period reshuffles scores, not just ranks. Weights: 75% revenue, 15% revenue per booking, 10% 1PAY share.">i</span>
         ${r.qualified?'':`<span style="margin-left:auto">needs Held &gt; ${RANK_MIN_HELD}</span>`}
       </div>
       <div class="meter"><i style="width:${(r.qualified?r.score:0)*100}%"></i></div>
       <div class="lb-stats">
         <span class="chip">Won <b>${fmtInt(r.m.won)}</b></span>
         <span class="chip">Held <b>${fmtInt(r.m.held)}</b></span>
         <span class="chip">Close <b>${fmtPct(r.m.closeRate)}</b></span>
         ${r.m.saleDays?`<span class="chip win">Selling days <b>${r.m.saleDays}</b></span>`:''}
         ${r.m.bestDay?`<span class="chip">Best day <b>${fmtMoney(r.m.bestDay)}</b></span>`:''}
       </div>`;
    board.appendChild(card);
  }
  return board;
}

const pctVal = r => r == null ? null : r*100;
// `basis`/`min`: the denominator a rate comes from, and the smallest denominator at
// which hitting the target means anything. Without it a rep who took 2 calls and showed
// for both "hits" a 50% show-rate target and out-ranks someone on 61 calls.
// `cumulative`: accrues over the period, so mid-period it is judged against elapsed time.
const TARGET_METRICS = {
  'Hours':{get:m=>m.hours,fmt:v=>fmtNum(v,1)+'h',cumulative:true},
  'Dials':{get:m=>m.dials,fmt:fmtInt,cumulative:true},
  'Sets':{get:m=>m.sets,fmt:fmtInt,cumulative:true},
  'Avg. dials per hour':{get:m=>m.dialsPerHour,fmt:v=>fmtNum(v,1),basis:m=>m.hours,min:1,unit:'hours'},
  'Avg. sets per hour':{get:m=>m.setsPerHour,fmt:v=>fmtNum(v,2),basis:m=>m.hours,min:1,unit:'hours'},
  'Cash collected':{get:m=>m.cash,fmt:fmtMoney,cumulative:true},
  'Sales':{get:m=>m.won,fmt:fmtInt,cumulative:true},
  'Show rate':{get:m=>pctVal(m.showRate),fmt:v=>v==null?'–':v.toFixed(1)+'%',basis:m=>m.booked,min:RATE_MIN,unit:'booked'},
  'Close rate':{get:m=>pctVal(m.closeRate),fmt:v=>v==null?'–':v.toFixed(1)+'%',basis:m=>m.held,min:RATE_MIN,unit:'held'},
  '1PAY ratio':{get:m=>pctVal(m.onePayPct),fmt:v=>v==null?'–':v.toFixed(1)+'%',basis:m=>m.won,min:RATE_MIN,unit:'won'},
  'Premium ratio':{get:m=>pctVal(m.premiumPct),fmt:v=>v==null?'–':v.toFixed(1)+'%',basis:m=>m.won,min:RATE_MIN,unit:'won'}
};
// agent_list says "TIER 3"; kpi_target splits it Full/Part Time and nothing in the data
// says which a rep is. Defaults to full-time, labelled in the UI.
function targetTier(tier) {
  if (/1/.test(tier)) return 'Tier 1';
  if (/2/.test(tier)) return 'Tier 2';
  return '3 - Full Time';
}

function renderProgress(rows, basis) {
  const card = el('div','card'), grid = el('div','prog-grid');
  const elapsed = elapsedFraction(state.from, state.to);
  let any = false;
  for (const r of rows) {
    if (!r.m.hasFunnel && !r.m.hasKpi) continue;
    const tt = targetTier(r.tier);
    const targets = DATA.targets.filter(t => t.t === tt && TARGET_METRICS[t.m] && t[basis.key]);
    if (!targets.length) continue;
    any = true;
    const box = el('div','glow'); box.style.padding = '2px';
    const html = []; let hit = 0, total = 0;
    for (const t of targets) {
      const spec = TARGET_METRICS[t.m];
      const actual = spec.get(r.m), target = t[basis.key];
      const pct = actual == null ? null : Math.max(0, actual/target);
      const basisVal = spec.basis ? spec.basis(r.m) : null;
      const thin = spec.basis && (basisVal == null || basisVal < spec.min);
      const met = pct != null && pct >= 1 && !thin;
      total++; if (met) hit++;
      const paced = spec.cumulative && elapsed > 0 && elapsed < 1;
      const onPace = paced && pct != null && pct >= elapsed;
      let tag = '';
      if (thin) tag = ` <span class="thin" title="Only ${fmtNum(basisVal, basisVal%1?1:0)} ${spec.unit} in this period - too few for the ratio to count as a target hit.">low volume</span>`;
      else if (met) tag = ' <span class="tick">✓</span>';
      else if (paced) tag = ` <span class="pace ${onPace?'ok':''}" title="${Math.round(elapsed*100)}% of the period has elapsed, so on-pace is ${spec.fmt(target*elapsed)} by now.">${onPace?'on pace':'behind pace'}</span>`;
      const marker = paced ? `<span class="pacemark" style="left:${(elapsed*100).toFixed(1)}%" title="Expected by now"></span>` : '';
      html.push(`<div class="prog-row"><div class="prog-top">
        <span class="m">${t.m}${tag}</span>
        <span class="v">${actual==null?'–':spec.fmt(actual)} / ${spec.fmt(target)}${pct==null?'':' · '+Math.round(pct*100)+'%'}</span>
        </div><div class="bar"><i class="${met?'met':''}${thin?' thin':''}" style="width:${pct==null?0:Math.min(100,pct*100)}%"></i>${marker}</div></div>`);
    }
    box.innerHTML = `<div class="prog-agent">${r.short} <span class="tier">${r.tier}${tt.startsWith('3')?' · full-time targets assumed':''}</span></div>
      <div class="hits">Targets hit <b>${hit}</b> of ${total}</div>` + html.join('');
    grid.appendChild(box);
  }
  if (!any) return null;
  card.appendChild(grid);
  return card;
}

// ---------------------------------------------------------------------------
// SALES LEADERBOARD
//
// Column definitions were reverse-engineered from the client's "Leaderboard" tab and
// verified against BigQuery - five of eight reps reconcile to the cent, including
// Laura's whole month-by-month row:
//   UPFRONT CASH        = SUM(upfront_cash)
//   GROSS REVENUE (TCP) = SUM(tcp)
//   PERSONAL BEST       = the best single calendar month of upfront cash this year
//   # of TOUCH POINTS   = dials
//   # of LEADS          = booked  (Won+Pending+Lost+NoShow+Missed+Cancelled)
//   WTD COLLECTED       = cash collected, week to date
//   RANK                = global dense rank on MTD upfront cash
// Three figures on that tab (Nelson $82k, Peter Jr $11k, Zac $12k) match no source in
// the workbook or the warehouse and appear hand-typed - see the flags panel.
// ---------------------------------------------------------------------------

/** Week/month/quarter/year to date, anchored to the newest date in the data. */
function windows(anchorISO) {
  const a = parseISO(anchorISO);
  const y = a.getFullYear(), m = a.getMonth();
  const mon = mondayOf(a);
  return {
    anchor: anchorISO,
    wtd:  [iso(mon), anchorISO],
    mtd:  [iso(new Date(y, m, 1)), anchorISO],
    qtd:  [iso(new Date(y, Math.floor(m/3)*3, 1)), anchorISO],
    ytd:  [iso(new Date(y, 0, 1)), anchorISO],
    pmtd: (() => { const s = new Date(y, m-1, 1); return [iso(s), iso(new Date(y, m, 0))]; })()
  };
}

/** Sum one field across a window, per agent. */
function windowSum(from, to, pick, src) {
  const out = new Map();
  for (const r of (src || DATA.funnel)) {
    if (r.d < from || r.d > to) continue;
    out.set(r.n, (out.get(r.n) || 0) + (pick(r) || 0));
  }
  return out;
}

/** Best single calendar month of upfront cash within the anchor year. */
function personalBests(year) {
  const perMonth = new Map();
  for (const r of DATA.funnel) {
    if (+r.d.slice(0,4) !== year) continue;
    const k = r.n + '|' + r.d.slice(0,7);
    perMonth.set(k, (perMonth.get(k) || 0) + (r.rev || 0));
  }
  const best = new Map();
  for (const [k, v] of perMonth) {
    const n = k.split('|')[0];
    if (v > (best.get(n) || 0)) best.set(n, v);
  }
  return best;
}

/** Dense rank, descending, ties share a rank - matching the sheet's RANK column. */
function denseRank(entries) {
  const vals = [...new Set(entries.map(e => e.v))].sort((a,b) => b-a);
  const pos = new Map(vals.map((v,i) => [v, i+1]));
  return new Map(entries.map(e => [e.k, pos.get(e.v)]));
}

function buildLeaderboard() {
  const w = windows(DATA_MAX);
  const yr = +DATA_MAX.slice(0,4);
  const S = (rng, pick, src) => windowSum(rng[0], rng[1], pick, src);
  const booked = r => r.won + r.pen + r.lost + r.ns + r.mis + r.can;

  const d = {
    ucMtd: S(w.mtd, r=>r.cash || 0, DATA.funnel), ucQtd: S(w.qtd, r=>r.cash || 0, DATA.funnel), ucYtd: S(w.ytd, r=>r.cash || 0, DATA.funnel),
    revMtd: S(w.mtd, r=>r.rev || 0, DATA.funnel), revQtd: S(w.qtd, r=>r.rev || 0, DATA.funnel), revYtd: S(w.ytd, r=>r.rev || 0, DATA.funnel),
    ucPmtd: S(w.pmtd, r=>r.cash || 0, DATA.funnel),
    touchPmtd: S(w.pmtd, r=>r.di, DATA.kpi),
    cashWtd: S(w.wtd, r=>r.cash),
    leadsWtd: S(w.wtd, booked), leadsMtd: S(w.mtd, booked),
    touchWtd: S(w.wtd, r=>r.di, DATA.kpi), touchMtd: S(w.mtd, r=>r.di, DATA.kpi),
    setsMtd: S(w.mtd, r=>r.se, DATA.kpi), hoursMtd: S(w.mtd, r=>r.hrs, DATA.kpi),
    apptsMtd: S(w.mtd, r=>r.ap, DATA.kpi),
    best: personalBests(yr)
  };

  const rows = DATA.agents.filter(a => a.s === 'ACTIVE').map(a => ({
    short: a.n, full: a.f, tier: a.t,
    ucMtd: d.ucMtd.get(a.n)||0, ucQtd: d.ucQtd.get(a.n)||0, ucYtd: d.ucYtd.get(a.n)||0,
    revMtd: d.revMtd.get(a.n)||0, revQtd: d.revQtd.get(a.n)||0, revYtd: d.revYtd.get(a.n)||0,
    ucPmtd: d.ucPmtd.get(a.n)||0, touchPmtd: d.touchPmtd.get(a.n)||0,
    cashWtd: d.cashWtd.get(a.n)||0,
    leadsWtd: d.leadsWtd.get(a.n)||0, leadsMtd: d.leadsMtd.get(a.n)||0,
    touchWtd: d.touchWtd.get(a.n)||0, touchMtd: d.touchMtd.get(a.n)||0,
    setsMtd: d.setsMtd.get(a.n)||0, hoursMtd: d.hoursMtd.get(a.n)||0,
    apptsMtd: d.apptsMtd.get(a.n)||0, best: d.best.get(a.n)||0
  }));

  // Global rank on MTD upfront cash, as the sheet does it, plus last month's rank
  // on the same basis so movement is like-for-like.
  const rank = denseRank(rows.map(r => ({ k:r.short, v:r.ucMtd })));
  const rankPrev = denseRank(rows.map(r => ({ k:r.short, v:r.ucPmtd })));
  for (const r of rows) {
    r.rank = rank.get(r.short);
    r.rankPrev = rankPrev.get(r.short);
    r.setsPerHour = div(r.setsMtd, r.hoursMtd);
  }
  return { rows, w };
}

const LB_CLOSER_COLS = [
  ['Upfront<br>MTD', r=>fmtMoney(r.ucMtd), true], ['Upfront<br>QTD', r=>fmtMoney(r.ucQtd)],
  ['Upfront<br>YTD', r=>fmtMoney(r.ucYtd)],
  ['Revenue<br>MTD', r=>fmtMoney(r.revMtd), true], ['Revenue<br>QTD', r=>fmtMoney(r.revQtd)],
  ['Revenue<br>YTD', r=>fmtMoney(r.revYtd)],
  ['Personal<br>best', r=>r.best?fmtMoney(r.best):'–', true],
  ['Touch<br>WTD', r=>fmtInt(r.touchWtd), true], ['Touch<br>MTD', r=>fmtInt(r.touchMtd)],
  ['Leads<br>WTD', r=>fmtInt(r.leadsWtd), true], ['Leads<br>MTD', r=>fmtInt(r.leadsMtd)],
  ['Collected<br>WTD', r=>fmtMoney(r.cashWtd), true]
];
const LB_SETTER_COLS = [
  ['Touch<br>WTD', r=>fmtInt(r.touchWtd), true], ['Touch<br>MTD', r=>fmtInt(r.touchMtd)],
  ['Leads<br>WTD', r=>fmtInt(r.leadsWtd), true], ['Leads<br>MTD', r=>fmtInt(r.leadsMtd)],
  ['Sets<br>MTD', r=>fmtInt(r.setsMtd), true], ['Hours<br>MTD', r=>fmtNum(r.hoursMtd,1)],
  ['Sets / hr', r=>fmtNum(r.setsPerHour,2)], ['Appts<br>MTD', r=>fmtInt(r.apptsMtd)],
  ['Upfront<br>YTD', r=>r.ucYtd?fmtMoney(r.ucYtd):'–', true]
];

function renderLbTable(tier, rows, isSetter) {
  // Closers rank on MTD upfront cash; setters produce no cash, so they rank on MTD
  // dials - the output of their role. Ranking setters on cash would be all zeroes.
  const sortKey = isSetter ? (r=>r.touchMtd) : (r=>r.ucMtd);
  const prevKey = isSetter ? (r=>r.touchPmtd) : (r=>r.ucPmtd);
  const sorted = rows.slice().sort((a,b) => sortKey(b) - sortKey(a));
  // Rank movement is computed WITHIN the tier, so it matches the # column beside it.
  // Comparing tier position against a global rank would put two different scales
  // next to each other.
  const tierRank = denseRank(sorted.map(r => ({ k:r.short, v:sortKey(r) })));
  const tierRankPrev = denseRank(sorted.map(r => ({ k:r.short, v:prevKey(r) })));
  const cols = isSetter ? LB_SETTER_COLS : LB_CLOSER_COLS;
  const anyone = sorted.some(r => sortKey(r) > 0);

  const card = el('div','card'), scroll = el('div','scroll'), t = el('table');
  t.innerHTML = `<thead><tr><th class="rk">#</th><th class="agent">Sales rep</th>` +
    cols.map(c => `<th class="${c[2]?'grp':''}">${c[0]}</th>`).join('') + `</tr></thead>`;
  const tb = el('tbody');

  for (const r of sorted) {
    const tr = el('tr');
    const tRank = tierRank.get(r.short);
    const earned = sortKey(r) > 0;
    // Medals only where something was actually produced - a medal for zero is noise.
    const medal = (earned && tRank <= 3) ? MEDALS[tRank-1] : '';
    // Only reps who actually produced something get a movement badge. A rep on zero
    // can climb the table purely because fewer colleagues sold this month, and showing
    // them "▲3" would read as improvement where there was none.
    let mv = '';
    if (earned) {
      const dlt = tierRankPrev.get(r.short) - tRank;
      if (dlt !== 0) mv = `<span class="mv ${dlt>0?'up':'down'}" title="${tier} rank ${tierRankPrev.get(r.short)} last month → ${tRank} now">${dlt>0?'▲':'▼'}${Math.abs(dlt)}</span>`;
    }
    tr.className = earned && tRank === 1 ? 'lead' : '';
    tr.innerHTML =
      `<td class="rk">${medal || (earned ? tRank : '<span class="nil">–</span>')}</td>` +
      `<td class="agent">${r.short}${mv}<span class="full">${r.full||''}</span></td>` +
      cols.map(c => { const v = c[1](r); return `<td class="${c[2]?'grp':''}${v==='–'||v==='$0'||v==='0'?' nil':''}">${v}</td>`; }).join('');
    tb.appendChild(tr);
  }

  if (sorted.length) {
    const tot = {};
    for (const k of ['ucMtd','ucQtd','ucYtd','revMtd','revQtd','revYtd','cashWtd',
                     'leadsWtd','leadsMtd','touchWtd','touchMtd','setsMtd','hoursMtd','apptsMtd'])
      tot[k] = sorted.reduce((s,r) => s + r[k], 0);
    tot.best = Math.max(...sorted.map(r => r.best), 0);
    tot.setsPerHour = div(tot.setsMtd, tot.hoursMtd);
    const tr = el('tr','overall');
    tr.innerHTML = `<td class="rk"></td><td class="agent">${tier} total<span class="full">${sorted.length} active rep${sorted.length===1?'':'s'}</span></td>` +
      cols.map(c => `<td class="${c[2]?'grp':''}">${c[1](tot)}</td>`).join('');
    tb.appendChild(tr);
  }
  t.appendChild(tb); scroll.appendChild(t); card.appendChild(scroll);
  if (!anyone) {
    const note = el('div','warn');
    note.style.margin = '0'; note.style.borderRadius = '0';
    note.innerHTML = isSetter
      ? `<b>No dialer activity recorded</b> for this tier in the current month.`
      : `<b>No upfront cash recorded</b> for this tier in the current month, so nobody is ranked.`;
    card.appendChild(note);
  }
  return card;
}

/** Insight cards computed from the data - nothing hardcoded except the provenance flags. */
function leaderboardInsights(rows, w) {
  const closers = rows.filter(r => !/3/.test(r.tier));
  const setters = rows.filter(r => /3/.test(r.tier));
  const good = [], flags = [];

  const teamMtd = closers.reduce((s,r) => s + r.ucMtd, 0);
  const teamYtd = closers.reduce((s,r) => s + r.ucYtd, 0);
  const top = closers.slice().sort((a,b) => b.ucMtd - a.ucMtd)[0];

  if (top && top.ucMtd > 0) {
    const share = teamMtd ? top.ucMtd/teamMtd : 0;
    good.push([`${top.short} leads the month`,
      `${fmtMoney(top.ucMtd)} upfront cash — ${fmtPct(share)} of everything the closers brought in this month.`]);
    if (share >= 0.6 && closers.filter(r => r.ucMtd > 0).length > 1) {
      flags.push([`Revenue is concentrated in one rep`,
        `${top.short} accounts for ${fmtPct(share)} of month-to-date cash. If they have a slow month or leave, the number goes with them.`]);
    }
  }

  // personal bests being set right now
  const pb = closers.filter(r => r.ucMtd > 0 && r.ucMtd >= r.best);
  if (pb.length) good.push([`Personal best${pb.length>1?'s':''} in progress`,
    `${pb.map(r=>r.short).join(', ')} ${pb.length>1?'are':'is'} at or above ${pb.length>1?'their':'their'} best month of the year so far.`]);

  // month-on-month movers
  const movers = closers.filter(r => r.ucPmtd > 0 || r.ucMtd > 0)
    .map(r => ({...r, delta: r.ucMtd - r.ucPmtd })).sort((a,b) => b.delta - a.delta);
  if (movers.length && movers[0].delta > 0)
    good.push([`Biggest improvement`, `${movers[0].short} is up ${fmtMoney(movers[0].delta)} on last month (${fmtMoney(movers[0].ucPmtd)} → ${fmtMoney(movers[0].ucMtd)}).`]);
  const faller = movers[movers.length-1];
  if (faller && faller.delta < 0)
    flags.push([`Sharpest drop`, `${faller.short} is down ${fmtMoney(Math.abs(faller.delta))} on last month (${fmtMoney(faller.ucPmtd)} → ${fmtMoney(faller.ucMtd)}).`]);

  // effort without result, and result without recorded effort
  const dry = closers.filter(r => r.leadsMtd >= 10 && r.ucMtd === 0);
  if (dry.length) flags.push([`Calls but no cash`,
    `${dry.map(r=>`${r.short} (${r.leadsMtd} leads)`).join(', ')} — double-digit leads this month and nothing closed. Worth a pipeline review rather than a target reminder.`]);

  const silentEffort = closers.filter(r => r.leadsMtd > 0 && r.touchMtd === 0);
  if (silentEffort.length) flags.push([`Leads recorded with zero dials`,
    `${silentEffort.map(r=>r.short).join(', ')} show booked calls but no touch points at all. Either the activity is not being logged, or leads arrive from somewhere other than outbound.`]);

  const idle = rows.filter(r => r.leadsMtd === 0 && r.touchMtd === 0 && r.ucMtd === 0);
  if (idle.length) flags.push([`No activity of any kind`,
    `${idle.map(r=>r.short).join(', ')} — all marked ACTIVE, but no cash, leads or dials this month. Either genuinely idle, or missing from the source consolidation.`]);

  const topSetter = setters.slice().sort((a,b) => b.touchMtd - a.touchMtd)[0];
  if (topSetter && topSetter.touchMtd > 0)
    good.push([`${topSetter.short} leads the dialer`,
      `${fmtInt(topSetter.touchMtd)} touch points this month over ${fmtNum(topSetter.hoursMtd,1)} hours, converting to ${fmtInt(topSetter.setsMtd)} set${topSetter.setsMtd===1?'':'s'}.`]);

  const setterNoSets = setters.filter(r => r.touchMtd >= 200 && r.setsMtd === 0);
  if (setterNoSets.length) flags.push([`High dials, zero sets`,
    `${setterNoSets.map(r=>`${r.short} (${fmtInt(r.touchMtd)} dials)`).join(', ')} — heavy dialing with nothing booked. Usually a list-quality or script problem, not effort.`]);

  if (teamYtd > 0) good.push([`Year to date`,
    `${fmtMoney(teamYtd)} upfront cash across the closer tiers, from ${closers.filter(r=>r.ucYtd>0).length} of ${closers.length} active closers.`]);

  // provenance - these are about the source, not performance
  flags.push([`Three source figures cannot be reproduced`,
    `Five of the eight reps on the client Leaderboard tab reconcile with this dashboard to the dollar. Three do not: it shows Nelson $82,000, Peter Jr $11,000 and Zac $12,000 year-to-date, and none of those reconcile with CURRENT DATA, MonthlySale or ALLCASH. Peter Jr and Zac appear in none of them, and CURRENT DATA holds no Tier 3 rows at all. Since everything else matches exactly, those three look hand-entered.`]);
  flags.push([`Two leaderboards, two answers`,
    `That workbook holds a second tab sourced from the ALLCASH ledger instead, which reports Laura $164,260 and Shane $68,800 against $189,567 and $55,000 here. ALLCASH also shows roughly $676k of 2026 cash across many closers not in the active roster, including about $59,800 with no closer named. Worth deciding which is the number of record.`]);

  return { good, flags };
}

function viewLeaderboard() {
  const frag = document.createDocumentFragment();
  const { rows, w } = buildLeaderboard();

  frag.appendChild(el('div','sec-head',
    `<h2>Sales leaderboard</h2>
     <span class="sec-note">Week, month, quarter and year to date as at <b style="color:var(--ink-2)">${w.anchor}</b>.
     This view is anchored to the latest data, so the period picker above does not apply.</span>`));

  TIERS.forEach((tier, i) => {
    const isSetter = tier === 'TIER 3';
    const tierRows = rows.filter(r => r.tier === tier);
    if (!tierRows.length) return;

    const panel = el('div','tier-panel');
    panel.setAttribute('style', tierVars(tier));

    const withData = tierRows.filter(r => (isSetter ? r.touchMtd : r.ucMtd) > 0).length;
    const headline = isSetter
      ? fmtInt(tierRows.reduce((s,r) => s + r.touchMtd, 0)) + ' touch points'
      : fmtMoney(tierRows.reduce((s,r) => s + r.ucMtd, 0));

    panel.appendChild(el('div','tier-band',
      `<div class="tier-num" aria-hidden="true">${TIER_STYLE[tier].num}</div>
       <div class="tier-titles">
         <div class="t">${tier} · ${isSetter?'Setters':'Closers'}</div>
         <div class="s">${isSetter
            ? 'Ranked on month-to-date touch points — setters produce no cash by design'
            : 'Ranked on month-to-date upfront cash'}</div>
       </div>
       <div class="tier-meta"><b>${headline}</b>month to date · ${withData} of ${tierRows.length} producing</div>`));

    panel.appendChild(renderLbTable(tier, tierRows, isSetter));
    frag.appendChild(panel);
    if (i < TIERS.length - 1) frag.appendChild(el('div','tier-gap'));
  });

  const { good, flags } = leaderboardInsights(rows, w);
  const sec = el('section','insights-sec');
  sec.appendChild(el('div','sec-head',
    `<h2>Insights</h2><span class="sec-note">Generated from the data on every load, not written by hand.</span>`));
  const grid = el('div','insights');
  for (const [t,b] of good) grid.appendChild(el('div','ins good glow', `<h4>▲ ${t}</h4><p>${b}</p>`));
  for (const [t,b] of flags) grid.appendChild(el('div','ins flag glow', `<h4>▼ ${t}</h4><p>${b}</p>`));
  sec.appendChild(grid);
  frag.appendChild(sec);
  return frag;
}

function viewTier(tierName, metrics, prior, basis) {
  const frag = document.createDocumentFragment();
  const rows = agentRows(metrics).filter(r => r.tier === tierName);
  const isSetter = tierName === 'TIER 3';
  if (!rows.length) { frag.appendChild(el('div','warn','No agents in this tier.')); return frag; }

  const sec = el('section');
  const head = el('div','sec-head');
  head.appendChild(el('h2', null, isSetter
    ? 'Tier 3 <span class="dim">· Setters</span>' : `${tierName} <span class="dim">· Closers</span>`));
  head.appendChild(el('span','sec-note', isSetter
    ? 'Dialer activity. Tier 3 have no sales funnel by design — they book, they do not close.'
    : 'Discovery call funnel.'));
  const withData = rows.filter(r => isSetter ? r.m.hasKpi : r.m.hasFunnel);
  if (!isSetter && withData.length) {
    const top = withData.slice().sort((a,b) => b.m.revenue - a.m.revenue)[0];
    if (top && top.m.revenue > 0)
      head.appendChild(el('span','badge', `★ Top performer · ${top.short} · ${fmtMoney(top.m.revenue)}`));
  }
  sec.appendChild(head);

  if (!isSetter) {
    const board = renderBoard(rows, prior);
    if (board) {
      const h = el('div','sec-head'); h.style.marginTop = '14px';
      h.appendChild(el('h2',null,'Leaderboard'));
      h.appendChild(el('span','sec-note', `Ranked by composite score · qualifier Held &gt; ${RANK_MIN_HELD}`));
      sec.appendChild(h); sec.appendChild(board);
    }
  }

  const th = el('div','sec-head'); th.style.marginTop = '18px';
  th.appendChild(el('h2', null, isSetter ? 'Activity' : 'Funnel detail'));
  sec.appendChild(th);
  sec.appendChild(renderTable(rows, isSetter ? SETTER_COLS : CLOSER_COLS,
    m => isSetter ? m.hasKpi : m.hasFunnel));

  const missing = rows.filter(r => r.active && (isSetter ? !r.m.hasKpi : !r.m.hasFunnel)).map(r => r.short);
  if (missing.length) sec.appendChild(el('div','warn',
    `<b>No data recorded</b> for ${missing.join(', ')} in this period. Shown as gaps rather than zeros — a blank and a genuine zero mean different things.`));

  const prog = renderProgress(rows, basis);
  if (prog) {
    const h = el('div','sec-head'); h.style.marginTop = '18px';
    h.appendChild(el('h2',null,'KPI progress'));
    h.appendChild(el('span','sec-note', `vs ${basis.label} targets`));
    sec.appendChild(h); sec.appendChild(prog);
  }
  frag.appendChild(sec);
  return frag;
}

// --- shell -----------------------------------------------------------------

function renderNav(metrics) {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const rows = agentRows(metrics);
  const items = [
    ['exec','Executive summary', null],
    ['board','Sales leaderboard', null],
    ['tier1','Tier 1 · Closers', 'TIER 1'],
    ['tier2','Tier 2 · Closers', 'TIER 2'],
    ['tier3','Tier 3 · Setters', 'TIER 3']
  ];
  for (const [key,label,tier] of items) {
    const b = el('button','nav-item');
    b.setAttribute('aria-current', String(state.view === key));
    let cnt = '';
    if (tier) {
      const tr = rows.filter(r => r.tier === tier);
      const wd = tr.filter(r => tier === 'TIER 3' ? r.m.hasKpi : r.m.hasFunnel).length;
      cnt = `<span class="cnt" title="Reps with data in this period">${wd}/${tr.length}</span>`;
    }
    // Tier nav dots carry the same ordinal colour as their panel, so the nav and the
    // leaderboard reinforce one another rather than being two unrelated schemes.
    const dotStyle = tier ? ` style="background:${TIER_STYLE[tier].spine}"` : '';
    b.innerHTML = `<span class="dot"${dotStyle}></span><span>${label}</span>${cnt}`;
    b.onclick = () => { state.view = key; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    nav.appendChild(b);
  }
  document.getElementById('navNote').innerHTML =
    `Showing <b style="color:var(--ink-2)">${state.from}</b> → <b style="color:var(--ink-2)">${state.to}</b>`;
}

function render() {
  const metrics = compute(state.from, state.to);
  const [pf,pt] = priorRange(state.from, state.to);
  const prior = compute(pf, pt);
  const basis = targetBasis(state.from, state.to);

  renderNav(metrics);
  // The leaderboard is anchored to to-date windows, so a period control would be a
  // dead input on that view. Hide it rather than leave something that does nothing.
  document.getElementById('period').hidden = state.view === 'board';

  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(
    state.view === 'exec' ? viewExec(metrics, prior, basis)
    : state.view === 'board' ? viewLeaderboard()
    : viewTier(state.view === 'tier1' ? 'TIER 1' : state.view === 'tier2' ? 'TIER 2' : 'TIER 3',
               metrics, prior, basis));
  bindGlow();
}

function syncPeriodUI() {
  const list = PERIODS[state.mode] || [];
  const sel = document.getElementById('periodSel');
  const custom = state.mode === 'custom';
  document.getElementById('stepper').hidden = custom;
  document.getElementById('customDates').hidden = !custom;
  if (!custom) {
    sel.innerHTML = list.map((p,i) => `<option value="${i}"${i===state.idx?' selected':''}>${p.label}</option>`).join('');
    document.getElementById('prev').disabled = state.idx <= 0;
    document.getElementById('next').disabled = state.idx >= list.length-1;
  }
  document.querySelectorAll('#modes button')
    .forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === state.mode)));
  document.getElementById('from').value = state.from;
  document.getElementById('to').value = state.to;
}

function applyPeriod() {
  if (state.mode !== 'custom') {
    const p = PERIODS[state.mode][state.idx];
    if (p) { state.from = p.from; state.to = p.to; }
  }
  syncPeriodUI();
  render();
}

function setMode(mode) {
  state.mode = mode;
  if (mode !== 'custom') {
    const list = PERIODS[mode];
    // land on the period containing the current start date, else the latest
    let i = list.findIndex(p => state.from >= p.from && state.from <= p.to);
    state.idx = i >= 0 ? i : list.length - 1;
  }
  applyPeriod();
}

// --- glow ------------------------------------------------------------------

let gx = 0, gy = 0, pending = false;
function onMove(e) {
  gx = e.clientX; gy = e.clientY;
  if (!pending) {
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const s = document.getElementById('spotlight');
      s.style.setProperty('--gx', gx+'px'); s.style.setProperty('--gy', gy+'px');
    });
  }
}
function bindGlow() {
  document.querySelectorAll('.glow').forEach(node => {
    if (node.dataset.glow) return;
    node.dataset.glow = '1';
    node.addEventListener('pointermove', e => {
      const r = node.getBoundingClientRect();
      node.style.setProperty('--mx', (e.clientX-r.left)+'px');
      node.style.setProperty('--my', (e.clientY-r.top)+'px');
    }, { passive:true });
  });
}

function boot() {
  buildPeriods();
  if (!PERIODS.month.length) throw new Error('No dated rows in data.json.');

  const modes = document.getElementById('modes');
  [['week','Weekly'],['month','Monthly'],['custom','Custom']].forEach(([k,label]) => {
    const b = el('button', null, label);
    b.dataset.k = k; b.setAttribute('aria-pressed','false');
    b.onclick = () => setMode(k);
    modes.appendChild(b);
  });
  document.getElementById('periodSel').onchange = e => { state.idx = +e.target.value; applyPeriod(); };
  document.getElementById('prev').onclick = () => { if (state.idx > 0) { state.idx--; applyPeriod(); } };
  document.getElementById('next').onclick = () => {
    if (state.idx < PERIODS[state.mode].length-1) { state.idx++; applyPeriod(); } };
  document.getElementById('from').onchange = e => { state.from = e.target.value; render(); };
  document.getElementById('to').onchange = e => { state.to = e.target.value; render(); };
  document.getElementById('period').hidden = false;

  const synced = DATA.synced_at ? DATA.synced_at.replace(/\+00$/,' UTC') : 'unknown';
  document.getElementById('sub').innerHTML =
    `FreedomAcademy AU · synced from the source sheet at <b>${synced}</b>`;

  const f = document.getElementById('footer');
  f.hidden = false;
  f.innerHTML = `
    <div><b>How to read this.</b> Every counter sums the source sheet's <code>#</code> column, not a row count —
    one row can record several no-shows. Booked = Won + Pending + Lost + No Show + Missed + Cancelled.
    Held = Won + Pending + Lost. A dash means the figure cannot be computed (no denominator), which is not the same as zero.</div>
    <div style="margin-top:8px">Composite scores are <b>relative to the reps in that tier for the selected period</b> —
    changing the period reshuffles scores, not just ranks. Rank movement compares the equal-length window immediately before.</div>
    <div style="margin-top:8px">Only periods that contain data are listed. Ratios computed on fewer than ${RATE_MIN}
    underlying events are marked <i>low volume</i> and cannot claim a target.</div>
    <div style="margin-top:8px">Figures are unreconciled. Check against GoHighLevel and Stripe before using any total externally.</div>`;

  window.addEventListener('pointermove', onMove, { passive:true });
  window.addEventListener('pointerdown', onMove, { passive:true });
  document.body.classList.add('cursor-live');

  // open on the most recent month that has data
  state.mode = 'month';
  state.idx = PERIODS.month.length - 1;
  applyPeriod();
}

fetch('data.json')
  .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(d => { DATA = d; boot(); })
  .catch(e => {
    document.getElementById('sub').textContent = '';
    document.getElementById('app').innerHTML =
      `<div class="card"><div class="err">Could not load <code>data.json</code> (${e.message}).<br>
       This page must be served over HTTP, not opened directly from the filesystem.</div></div>`;
  });
</script>
